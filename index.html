<section class="section"><div class="container"><div class="section-head"><div><span class="eyebrow">Simple et rapide</span><h2>De la découverte à ton premier design.</h2></div></div><div class="steps"><div><b>01</b><h3>Découvre</h3><p>Explore les packs et choisis celui adapté à ton activité.</p></div><div><b>02</b><h3>Achète</h3><p>Choisis ton moyen de paiement et confirme ta commande.</p></div><div><b>03</b><h3>Reçois</h3><p>Après validation, retrouve ton accès depuis ton espace client.</p></div><div><b>04</b><h3>Crée & vends</h3><p>Personnalise tes designs ou utilise la formation pour progresser.</p></div></div></div></section>
${reviews()}<section class="container cta"><div><span class="eyebrow">À toi de jouer</span><h2>Ton prochain design peut commencer maintenant.</h2><p>Choisis un template ou commence ton parcours de formation.</p></div><div class="hero-actions" style="margin-top:0"><button class="btn btn-primary" onclick="go('/boutique')">Découvrir les templates</button><button class="btn btn-ghost" onclick="go('/formation')">Voir la formation</button></div></section>`}
function reviews(){return `<section class="section" id="avis"><div class="container"><div class="section-head"><div><span class="eyebrow">Confiance</span><h2>Ils font confiance à Theo Design.</h2></div><p>Des retours courts, concrets et orientés résultat.</p></div><div class="testimonials">${testimonials.map(t=>`<div class="quote"><div style="display:flex;gap:12px;align-items:center"><div class="avatar">${t[1]}</div><div><b>${t[0]}</b><div class="stars">${t[2]}</div></div></div><p>“${t[3]}”</p><small>Client Theo Design</small></div>`).join('')}</div></div></section>`}
function shop(){return `<section class="section"><div class="container"><span class="eyebrow">Boutique</span><h2 style="margin:10px 0 12px">Des templates prêts à vendre.</h2><p style="color:var(--muted);max-width:700px">Choisis une collection, personnalise-la dans Canva et gagne du temps sur tes prochaines publications.</p><div class="filters">${['Tous','Instagram','Facebook','WhatsApp','Business','Restaurants','Mode','Beauté','Promotions'].map((x,i)=>`<button class="filter ${i===0?'active':''}" onclick="filterProducts(this,'${x}')">${x}</button>`).join('')}</div><div id="productGrid" class="products">${PRODUCTS.map(card).join('')}</div></div></section>`}
function filterProducts(btn,cat){document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const list=cat==='Tous'?PRODUCTS:PRODUCTS.filter(p=>p.cats.includes(cat));document.getElementById('productGrid').innerHTML=list.length?list.map(card).join(''):`<div class="empty" style="grid-column:1/-1">Aucun produit dans cette catégorie.</div>`}
function productPage(id){const p=PRODUCTS.find(x=>x.id===id);if(!p)return notFound();return `<section class="section"><div class="container"><button class="btn btn-ghost" onclick="go('/boutique')">← Retour à la boutique</button><div class="split" style="margin-top:18px"><div>${productMock(p,1)}<div class="notice" style="margin-top:12px">✓ Aperçu indicatif. Le contenu final est remis après validation du paiement.</div></div><div><span class="eyebrow">Template numérique</span><h2 style="margin:10px 0">${p.name}</h2><p style="color:var(--muted)">${p.desc}</p><div class="price" style="font-size:32px">${money(p.price)}</div><button class="btn btn-primary" style="width:100%;padding:14px" onclick="addToCart('${p.id}')">Acheter maintenant</button><div class="stats"><div class="stat"><b>${p.count}</b><span>Templates</span></div><div class="stat"><b>${p.format.split(' ')[0]}</b><span>Format</span></div><div class="stat"><b>${p.software}</b><span>Logiciel</span></div><div class="stat"><b>Débutant</b><span>Niveau</span></div></div></div></div><div style="margin-top:50px" class="feature-box"><h3>Ce que tu vas recevoir</h3><div class="checks"><div class="check"><b>✓</b> Templates modifiables</div><div class="check"><b>✓</b> Fichiers prêts à utiliser</div><div class="check"><b>✓</b> Lien Canva</div><div class="check"><b>✓</b> Guide d’utilisation</div><div class="check"><b>✓</b> Accès immédiat après validation</div></div><p style="color:var(--muted)">Catégories : ${p.cats.join(' · ')}</p></div></div></section>`}
function training(){const mods=[['Introduction au design',['Principes fondamentaux','Types de designs','Comprendre son client']],['Canva',['Prise en main','Création d’un design','Utilisation des modèles','Couleurs et typographies','Techniques avancées']],['Photoshop',['Interface','Calques','Détourage','Retouche','Effets','Création d’affiches professionnelles']],['Identité visuelle',['Logo','Palette de couleurs','Typographie','Charte graphique','Branding']],['Création de contenus pour les réseaux sociaux',['Facebook','Instagram','WhatsApp','TikTok','Publicités']],['Design commercial',['Flyers','Affiches','Menus','Promotions','Catalogues','Publications commerciales']],['Trouver des clients',['Construire son portfolio','Trouver ses premiers clients','Utiliser WhatsApp','Utiliser Facebook','Utiliser TikTok']],['Monétiser ses compétences',['Fixer ses prix','Créer des offres','Vendre des templates','Vendre ses services','Fidéliser ses clients']]];return `<section class="section"><div class="container"><span class="eyebrow">Formation complète</span><h2 style="max-width:900px;margin:12px 0">Apprends le design graphique de zéro jusqu’à un niveau professionnel.</h2><p style="color:var(--muted);max-width:760px;font-size:17px">Une formation pratique destinée aux débutants et aux personnes qui souhaitent transformer le design en compétence professionnelle.</p><div class="stats"><div class="stat"><b>8</b><span>Modules</span></div><div class="stat"><b>Débutant → avancé</b><span>Niveau</span></div><div class="stat"><b>Accès</b><span>Aux cours</span></div><div class="stat"><b>Bonus</b><span>Inclus</span></div></div><div class="split" style="margin-top:28px"><div class="course-box"><h3>Programme</h3><div class="modules">${mods.map((m,i)=>`<details class="module" ${i===0?'open':''}><summary>Module ${i+1} — ${m[0]}</summary><div class="module-content"><ul>${m[1].map(x=>`<li>${x}</li>`).join('')}</ul></div></details>`).join('')}</div></div><div class="feature-box"><span class="eyebrow">Offre formation</span><h3>Transforme ton savoir-faire en activité.</h3><p style="color:var(--muted)">Une progression pratique : apprendre, produire, construire un portfolio, trouver des clients puis monétiser tes compétences.</p><div class="price" style="font-size:34px">49 900 FCFA</div><button class="btn btn-primary" style="width:100%;padding:14px" onclick="openCheckout('formation')">S’inscrire à la formation</button><div class="checks"><div class="check"><b>✓</b> Templates professionnels</div><div class="check"><b>✓</b> Ressources graphiques</div><div class="check"><b>✓</b> Bibliothèque de polices</div><div class="check"><b>✓</b> Palettes de couleurs</div><div class="check"><b>✓</b> Checklist design professionnel</div><div class="check"><b>✓</b> Conseils pour trouver des clients</div></div></div></div></div></section>`}
function client(){if(!state.user)return `<section class="section"><div class="container"><div class="feature-box" style="max-width:560px;margin:auto"><span class="eyebrow">Espace client</span><h2 style="margin:10px 0">Retrouve tes achats.</h2><p style="color:var(--muted)">Connecte-toi pour consulter tes commandes, récupérer tes produits et accéder à ta formation.</p><button class="btn btn-primary" onclick="openLogin()">Se connecter</button></div></div></section>`;const orders=state.orders.filter(o=>o.email===state.user.email);return `<section class="section"><div class="container"><div class="section-head"><div><span class="eyebrow">Mon espace</span><h2>Bonjour ${state.user.name}.</h2></div><button class="btn btn-ghost" onclick="logout()">Déconnexion</button></div><div class="dashboard"><aside class="side"><button class="active">Mes achats</button><button onclick="showToast('La progression de formation sera activée avec le backend.')">Ma formation</button><button onclick="openProfile()">Mon profil</button></aside><div class="panel"><h3>Mes commandes</h3>${orders.length?`<table class="table"><thead><tr><th>Commande</th><th>Date</th><th>Total</th><th>Accès</th></tr></thead><tbody>${orders.map(o=>`<tr><td>#${o.id}</td><td>${o.date}</td><td>${money(o.total)}</td><td><button class="btn btn-ghost" onclick="downloadOrder('${o.id}')">Accéder</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Tu n’as encore aucun achat. <button class="btn btn-primary" onclick="go(\'/boutique\')">Voir la boutique</button></div>'}</div></div></div></section>`}
function admin(){if(!state.admin)return `<section class="section"><div class="container"><div class="feature-box" style="max-width:560px;margin:auto"><span class="eyebrow">Administration</span><h2 style="margin:10px 0">Tableau de bord Theo Design.</h2><p style="color:var(--muted)">MVP local : accès de démonstration pour gérer les ventes et le catalogue. En production, cet espace doit être protégé côté serveur.</p><button class="btn btn-primary" onclick="adminLogin()">Ouvrir l’administration</button></div></div></section>`;return `<section class="section"><div class="container"><div class="section-head"><div><span class="eyebrow">Admin</span><h2>Tableau de bord.</h2></div><button class="btn btn-ghost" onclick="state.admin=false;localStorage.removeItem('td_admin');render()">Quitter</button></div><div class="stats"><div class="stat"><b>${state.orders.length}</b><span>Commandes</span></div><div class="stat"><b>${PRODUCTS.length}</b><span>Produits</span></div><div class="stat"><b>${money(state.orders.reduce((a,o)=>a+o.total,0))}</b><span>Chiffre d’affaires local</span></div><div class="stat"><b>${new Set(state.orders.map(o=>o.email)).size}</b><span>Clients</span></div></div><div class="panel" style="margin-top:20px"><h3>Commandes récentes</h3>${state.orders.length?`<table class="table"><thead><tr><th>ID</th><th>Client</th><th>Montant</th><th>Moyen</th><th>Statut</th></tr></thead><tbody>${state.orders.slice().reverse().map(o=>`<tr><td>#${o.id}</td><td>${o.email}</td><td>${money(o.total)}</td><td>${o.method}</td><td>${o.status}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Aucune commande.</div>'}</div><div class="panel" style="margin-top:20px"><h3>Catalogue</h3><table class="table"><thead><tr><th>Produit</th><th>Prix</th><th>Templates</th><th>Catégories</th></tr></thead><tbody>${PRODUCTS.map(p=>`<tr><td>${p.name}</td><td>${money(p.price)}</td><td>${p.count}</td><td>${p.cats.join(', ')}</td></tr>`).join('')}</tbody></table></div></div></section>`}
function notFound(){return `<section class="section"><div class="container empty"><h2>Page introuvable</h2><button class="btn btn-primary" onclick="go('/')">Retour</button></div></section>`}
function footer(){return `<footer class="footer"><div class="container footer-grid"><div><div class="brand">THEO<span>DESIGN</span></div><p>Designs numériques et formation graphique pour créateurs et entrepreneurs.</p></div><div><h4>Navigation</h4><a href="#/boutique">Boutique</a><a href="#/formation">Formation</a><a href="#/client">Espace client</a></div><div><h4>Assistance</h4><a href="https://wa.me/237670082328" target="_blank">WhatsApp</a><a href="#/paiement">Paiement</a></div><div><h4>Admin</h4><a href="#/admin">Tableau de bord</a><small>© 2026 Theo Design</small></div></div></footer>`}
function payment(){return `<section class="section"><div class="container"><span class="eyebrow">Paiement</span><h2 style="margin:10px 0">Paiement simple et rassurant.</h2><p style="color:var(--muted);max-width:720px">Pour le MVP, le paiement est préparé autour des moyens utilisés au Cameroun. La validation finale peut ensuite être reliée à un prestataire de paiement avec confirmation serveur.</p><div class="paybox"><div class="paymethod"><b>Mobile Money</b>670 26 78 51</div><div class="paymethod"><b>Orange Money</b>689 04 28 63</div><div class="paymethod"><b>MTN MoMo</b>Disponible selon le compte marchand configuré.</div></div><div class="notice">Ne saisis jamais ton code PIN dans le site. Après paiement, conserve la preuve de transaction et contacte Theo Design si une validation manuelle est nécessaire.</div></div></section>`}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.add('open')};function closeModal(){document.getElementById('modal').classList.remove('open')}
function openCart(){const items=state.cart.map(id=>PRODUCTS.find(p=>p.id===id)).filter(Boolean);const total=items.reduce((a,p)=>a+p.price,0);openModal(`<div class="modal-head"><div><span class="eyebrow">Panier</span><h2 style="margin:7px 0">${items.length?'Ton panier':'Ton panier est vide'}</h2></div><button class="close" onclick="closeModal()">×</button></div>${items.length?`<div class="checks">${items.map(p=>`<div class="paymethod"><div style="display:flex;justify-content:space-between;gap:10px"><span>${p.name}</span><b>${money(p.price)}</b></div></div>`).join('')}</div><div class="price">Total : ${money(total)}</div><button class="btn btn-primary" style="width:100%" onclick="openCheckout('cart')">Passer au paiement</button>`:'<div class="empty"><button class="btn btn-primary" onclick="closeModal();go(\'/boutique\')">Découvrir les produits</button></div>'}`)}
function openCheckout(kind){let items=kind==='formation'?[{id:'formation',name:'Formation complète en design graphique',price:49900}]:state.cart.map(id=>PRODUCTS.find(p=>p.id===id)).filter(Boolean);if(!items.length){showToast('Ton panier est vide.');return}const total=items.reduce((a,p)=>a+p.price,0);openModal(`<div class="modal-head"><div><span class="eyebrow">Checkout</span><h2 style="margin:7px 0">Finaliser la commande</h2></div><button class="close" onclick="closeModal()">×</button></div><form class="form" onsubmit="submitOrder(event,'${kind}')"><div><label>Nom complet</label><input id="coName" required placeholder="Ton nom"></div><div><label>WhatsApp / téléphone</label><input id="coPhone" required placeholder="6XXXXXXXX"></div><div><label>Email</label><input id="coEmail" type="email" required placeholder="ton@email.com"></div><div><label>Moyen de paiement</label><select id="coMethod"><option>Mobile Money — 670 26 78 51</option><option>Orange Money — 689 04 28 63</option><option>MTN MoMo</option></select></div><div class="notice">Total à payer : <b>${money(total)}</b><br>Après le paiement, garde la preuve de transaction. Le MVP enregistre la commande localement ; la validation automatique nécessite un backend et une API de paiement.</div><button class="btn btn-primary" type="submit">J’ai effectué le paiement → Confirmer</button></form>`)}
function submitOrder(e,kind){e.preventDefault();const items=kind==='formation'?[{id:'formation',name:'Formation complète en design graphique',price:49900}]:state.cart.map(id=>PRODUCTS.find(p=>p.id===id)).filter(Boolean);const total=items.reduce((a,p)=>a+p.price,0);const order={id:Date.now().toString().slice(-7),name:document.getElementById('coName').value,phone:document.getElementById('coPhone').value,email:document.getElementById('coEmail').value,method:document.getElementById('coMethod').value,total,items:items.map(x=>x.id),date:new Date().toLocaleDateString('fr-FR'),status:'À valider'};state.orders.push(order);state.user={name:order.name,email:order.email,phone:order.phone};state.cart=[];save();closeModal();showToast('Commande enregistrée. Contacte Theo Design avec ta preuve de paiement.');go('/client')}
function addToCart(id){if(!state.cart.includes(id))state.cart.push(id);save();showToast('Produit ajouté au panier.');}
function updateCart(){document.getElementById('cartCount').textContent=state.cart.length}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)}
function openLogin(){openModal(`<div class="modal-head"><div><span class="eyebrow">Espace client</span><h2 style="margin:7px 0">Connexion rapide</h2></div><button class="close" onclick="closeModal()">×</button></div><form class="form" onsubmit="login(event)"><div><label>Email</label><input id="loginEmail" type="email" required></div><div><label>Nom</label><input id="loginName" required></div><button class="btn btn-primary">Entrer dans mon espace</button></form><p style="font-size:12px;color:var(--muted)">MVP : l’authentification réelle devra être déplacée côté serveur avec sessions sécurisées ou OAuth.</p>`)}
function login(e){e.preventDefault();state.user={email:document.getElementById('loginEmail').value,name:document.getElementById('loginName').value};save();closeModal();render()}
function logout(){state.user=null;save();render()}
function openProfile(){showToast('Le profil complet sera relié au backend dans la version production.')}
function adminLogin(){openModal(`<div class="modal-head"><div><span class="eyebrow">Admin</span><h2 style="margin:7px 0">Connexion démo</h2></div><button class="close" onclick="closeModal()">×</button></div><form class="form" onsubmit="e=>e"><div><label>Code démo</label><input id="adminCode" type="password" required placeholder="theo2026"></div><button class="btn btn-primary" type="button" onclick="if(document.getElementById('adminCode').value==='theo2026'){state.admin=true;localStorage.setItem('td_admin','1');closeModal();render()}else showToast('Code incorrect.')">Ouvrir</button></form><p style="font-size:12px;color:var(--muted)">Ce code est uniquement pour la démonstration locale. Ne pas l’utiliser en production.</p>`)}
function downloadOrder(id){const o=state.orders.find(x=>x.id===id);if(!o)return;const names=o.items.map(id=>id==='formation'?'Formation complète en design graphique':PRODUCTS.find(p=>p.id===id)?.name).filter(Boolean);openModal(`<div class="modal-head"><div><span class="eyebrow">Commande #${o.id}</span><h2 style="margin:7px 0">Tes accès</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="notice">Statut : <b>${o.status}</b>. Pour un MVP sécurisé, les fichiers sont remis après validation du paiement.</div><div class="checks">${names.map(n=>`<div class="paymethod"><b>${n}</b><small>Accès prévu après validation</small></div>`).join('')}</div><a class="btn btn-primary" href="https://wa.me/237670082328?text=Bonjour%20Theo%20Design%2C%20je%20viens%20de%20passer%20la%20commande%20%23${o.id}%20et%20je%20souhaite%20la%20validation." target="_blank">Envoyer la preuve sur WhatsApp</a>`)}
function toggleMobileNav(){const n=document.querySelector('.navlinks');n.style.display=n.style.display==='flex'?'none':'flex';n.style.position='absolute';n.style.top='64px';n.style.left='0';n.style.right='0';n.style.padding='16px';n.style.background='#0b0d11';n.style.flexDirection='column'}
function render(){let path=location.hash.replace(/^#/,'')||'/';let content=path==='/'?home():path==='/boutique'?shop():path==='/formation'?training():path==='/client'?client():path==='/admin'?admin():path==='/paiement'?payment():path.startsWith('/produit/')?productPage(path.split('/')[2]):notFound();document.getElementById('app').innerHTML=content+footer();updateCart();window.scrollTo({top:0,behavior:'instant'})}
window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
